name: IdeaClient DEV CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build Next.js client
        run: yarn build
      - name: Run unit tests
        if: success() || failure()
        run: yarn test --watch=false
